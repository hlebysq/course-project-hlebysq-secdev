name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint & Format
        run: |
          ruff check --output-format=github .
          black --check .
          isort --check-only .

      - name: Prepare .env for CI
        run: cp .env.example .env

      - name: Tests
        run: |
          docker run -d --name test-db \
            -e POSTGRES_DB=secdev_app \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=password \
            -p 5432:5432 \
            postgres:15

          # Ждем готовности БД
          echo "Waiting for test database..."
          for i in {1..30}; do
            if docker exec test-db pg_isready -U postgres > /dev/null 2>&1; then
              echo "Test database is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Test database failed to become ready"
              docker logs test-db
              exit 1
            fi
            sleep 2
          done

          # Запускаем тесты
          pytest -q

          # Останавливаем и удаляем БД
          docker stop test-db
          docker rm test-db

      - name: Pre-commit (all files)
        run: pre-commit run --all-files

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build Docker image
        run: |
          IMAGE_NAME=secdev-app:ci
          docker build -t $IMAGE_NAME .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: secdev-app:ci
          format: 'table'
          output: 'trivy-report.txt'
        continue-on-error: true

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Generate SBOM with Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          IMAGE_NAME=secdev-app:ci
          syft $IMAGE_NAME -o json > sbom.json
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Scan image with Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          IMAGE_NAME=secdev-app:ci
          grype $IMAGE_NAME -o json > grype-report.json
        continue-on-error: true

      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: grype-report.json

      - name: Assert container runs as non-root user
        run: |
          IMAGE_NAME=secdev-app:ci
          USER_ID=$(docker run --rm $IMAGE_NAME id -u)
          if [ "$USER_ID" -eq 0 ]; then
            echo "Container runs as root!"
            exit 1
          fi
          echo "Non-root user verified: UID=$USER_ID"

      - name: Wait for service healthy (HTTP /health)
        run: |
          docker compose -f compose.ci.yml build --no-cache
          docker compose -f compose.ci.yml up -d

          sleep 5

          echo "=== Container status ==="
          docker compose -f compose.ci.yml ps

          echo "=== App logs ==="
          docker compose -f compose.ci.yml logs app-ci

          echo "=== DB logs ==="
          docker compose -f compose.ci.yml logs db

          # Проверяем healthcheck приложения
          MAX_RETRIES=40
          i=0
          STATUS=000
          until [ $i -ge $MAX_RETRIES ]
          do
            if ! docker compose -f compose.ci.yml ps app-ci | grep -q "Up"; then
              echo "Container stopped running!"
              echo "=== Full logs ==="
              docker compose -f compose.ci.yml logs
              docker compose -f compose.ci.yml down --volumes --remove-orphans
              exit 1
            fi

            STATUS=$(docker compose -f compose.ci.yml exec -T app-ci curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Service healthy!"
              break
            fi
            i=$((i+1))
            echo "Waiting for service... ($i/$MAX_RETRIES) Status: $STATUS"
            sleep 3
          done

          if [ "$STATUS" -ne 200 ]; then
            echo "Service did not become healthy"
            echo "=== Final logs ==="
            docker compose -f compose.ci.yml logs --no-prefix --tail=200
            docker compose -f compose.ci.yml down --volumes --remove-orphans
            exit 1
          fi

          echo "Integration test passed!"
          docker compose -f compose.ci.yml down --volumes --remove-orphans

      - name: Cleanup .env
        run: rm -f .env
