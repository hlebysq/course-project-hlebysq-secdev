services:
  app-ci:
    build: .
    environment:
      APP_ENV: dev
      LOG_LEVEL: info
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/secdev_app
      SQL_DEBUG: false
      OUTGOING_TIMEOUT_CONNECT: 5.0
      OUTGOING_TIMEOUT_READ: 5.0
      OUTGOING_MAX_RETRIES: 2
      OUTGOING_MAX_RESPONSE_BYTES: 1048576
      OUTGOING_MAX_CONN: 10
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: secdev_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
