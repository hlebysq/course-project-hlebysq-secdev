services:
  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SQL_DEBUG: ${SQL_DEBUG}
      OUTGOING_TIMEOUT_CONNECT: ${OUTGOING_TIMEOUT_CONNECT}
      OUTGOING_TIMEOUT_READ: ${OUTGOING_TIMEOUT_READ}
      OUTGOING_MAX_RETRIES: ${OUTGOING_MAX_RETRIES}
      OUTGOING_MAX_RESPONSE_BYTES: ${OUTGOING_MAX_RESPONSE_BYTES}
      OUTGOING_MAX_CONN: ${OUTGOING_MAX_CONN}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles: ["dev"]

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
